name: 构建 M5Cardputer ADV 固件

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: 检出源码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: 安装构建工具
        run: python -m pip install --disable-pip-version-check platformio==6.2.0 pytest==8.4.2

      - name: 编译固件
        run: pio run

      - name: 生成可直接刷入的完整固件
        shell: bash
        run: |
          mkdir -p dist
          BUILD_DIR=.pio/build/m5stack-stamps3
          cp "$BUILD_DIR/firmware.bin" dist/BW-Cardputer-ADV.bin
          python "$HOME/.platformio/packages/tool-esptoolpy/esptool.py" \
            --chip esp32s3 merge_bin \
            -o dist/BW-Cardputer-ADV-full.bin \
            0x0 "$BUILD_DIR/bootloader.bin" \
            0x8000 "$BUILD_DIR/partitions.bin" \
            0xe000 "$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin" \
            0x10000 "$BUILD_DIR/firmware.bin"
          cd dist
          sha256sum BW-Cardputer-ADV.bin BW-Cardputer-ADV-full.bin > SHA256SUMS.txt

      - name: 运行固件测试
        env:
          BW_FIRMWARE: dist/BW-Cardputer-ADV-full.bin
        run: pytest -q tests

      - name: 上传固件
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BW-Cardputer-ADV-firmware
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: 下载已验证固件
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: BW-Cardputer-ADV-firmware
          path: dist

      - name: 发布版本固件
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true
